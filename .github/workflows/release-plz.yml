name: Release-plz

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

jobs:
  release-plz:
    uses: wrightkit/.github/.github/workflows/release-plz-crates.yml@main
    permissions:
      contents: write
      pull-requests: write
    secrets:
      github-token: ${{ secrets.GH_TOKEN }}
      cargo-registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-context:
    name: Resolve opy-rs release
    if: needs.release-plz.outputs.releases_created == 'true'
    needs: release-plz
    runs-on: ubuntu-latest
    outputs:
      opy_release_created: ${{ steps.resolve.outputs.opy_release_created }}
      opy_release_tag: ${{ steps.resolve.outputs.opy_release_tag }}

    steps:
      - name: Select opy-rs release metadata
        id: resolve
        env:
          RELEASES: ${{ needs.release-plz.outputs.releases }}
        run: |
          set -euo pipefail
          opy_release_tag="$(jq -r 'map(select(.package_name == "opy-rs")) | first | .tag // empty' <<<"$RELEASES")"
          if [[ -n "$opy_release_tag" ]]; then
            echo "opy_release_created=true" >> "$GITHUB_OUTPUT"
            echo "opy_release_tag=$opy_release_tag" >> "$GITHUB_OUTPUT"
          else
            echo "opy_release_created=false" >> "$GITHUB_OUTPUT"
            echo "opy_release_tag=" >> "$GITHUB_OUTPUT"
          fi

  provider:
    name: Provider (${{ matrix.target }})
    if: needs.release-context.outputs.opy_release_created == 'true'
    needs: release-context
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-context.outputs.opy_release_tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build provider
        run: cargo build --locked --release --target ${{ matrix.target }} -p opy-provider --bin opy-provider

      - name: Archive provider
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.release-context.outputs.opy_release_tag }}
        run: |
          VERSION="${VERSION#v}"
          mkdir -p dist
          if [[ "$TARGET" == *windows* ]]; then
            BINARY=opy-provider.exe
          else
            BINARY=opy-provider
          fi
          cp "target/$TARGET/release/$BINARY" "dist/$BINARY"
          tar -czf "opy-provider-$VERSION-$TARGET.tar.gz" -C dist "$BINARY"
          ARCHIVE="opy-provider-$VERSION-$TARGET.tar.gz"
          CHECKSUM="${ARCHIVE}.sha256"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "$CHECKSUM"
          else
            shasum -a 256 "$ARCHIVE" > "$CHECKSUM"
          fi

      - name: Stage provider artifact and checksum
        uses: actions/upload-artifact@v7
        with:
          name: opy-provider-${{ matrix.target }}
          path: |
            opy-provider-*.tar.gz
            opy-provider-*.tar.gz.sha256

  publish-provider-github:
    name: Publish provider artifacts to GitHub Release
    if: needs.release-context.outputs.opy_release_created == 'true'
    needs:
      - release-context
      - provider
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all target artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Verify provider artifacts and checksums
        env:
          RELEASE_TAG: ${{ needs.release-context.outputs.opy_release_tag }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          for target in \
            x86_64-unknown-linux-gnu \
            x86_64-apple-darwin \
            aarch64-apple-darwin \
            x86_64-pc-windows-msvc; do
            archive="opy-provider-${VERSION}-${target}.tar.gz"
            checksum="${archive}.sha256"
            source_dir="dist/opy-provider-${target}"
            test -f "${source_dir}/${archive}"
            test -f "${source_dir}/${checksum}"
            (cd "$source_dir" && sha256sum --check "$checksum")
          done

      - name: Upload provider artifacts to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-context.outputs.opy_release_tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            dist/*/opy-provider-*.tar.gz \
            dist/*/opy-provider-*.tar.gz.sha256

  publish-provider-r2:
    name: Publish provider artifacts to Cloudflare R2
    if: needs.release-context.outputs.opy_release_created == 'true'
    needs:
      - release-context
      - provider
      - publish-provider-github
    runs-on: ubuntu-latest

    steps:
      - name: Download all target artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Verify provider artifacts and checksums
        env:
          RELEASE_TAG: ${{ needs.release-context.outputs.opy_release_tag }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          for target in \
            x86_64-unknown-linux-gnu \
            x86_64-apple-darwin \
            aarch64-apple-darwin \
            x86_64-pc-windows-msvc; do
            archive="opy-provider-${VERSION}-${target}.tar.gz"
            checksum="${archive}.sha256"
            source_dir="dist/opy-provider-${target}"
            test -f "${source_dir}/${archive}"
            test -f "${source_dir}/${checksum}"
            (cd "$source_dir" && sha256sum --check "$checksum")
          done

      - name: Upload immutable provider artifacts to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          RELEASE_TAG: ${{ needs.release-context.outputs.opy_release_tag }}
          R2_BUCKET: wrightkit-release
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          aws --version
          VERSION="${RELEASE_TAG#v}"
          for target in \
            x86_64-unknown-linux-gnu \
            x86_64-apple-darwin \
            aarch64-apple-darwin \
            x86_64-pc-windows-msvc; do
            archive="opy-provider-${VERSION}-${target}.tar.gz"
            checksum="${archive}.sha256"
            source_dir="dist/opy-provider-${target}"
            key="opy-rs/releases/${VERSION}/${archive}"
            aws s3api put-object \
              --bucket "$R2_BUCKET" \
              --key "$key" \
              --body "${source_dir}/${archive}" \
              --if-none-match '*' \
              --cache-control 'public, max-age=31536000, immutable' \
              --content-type 'application/octet-stream' \
              --endpoint-url "$R2_ENDPOINT" >/dev/null
            aws s3api put-object \
              --bucket "$R2_BUCKET" \
              --key "${key}.sha256" \
              --body "${source_dir}/${checksum}" \
              --if-none-match '*' \
              --cache-control 'public, max-age=31536000, immutable' \
              --content-type 'text/plain; charset=utf-8' \
              --endpoint-url "$R2_ENDPOINT" >/dev/null
          done

      - name: Verify public R2 artifacts and checksums
        env:
          RELEASE_TAG: ${{ needs.release-context.outputs.opy_release_tag }}
          R2_PUBLIC_BASE_URL: https://releases.wrightkit.dev
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          verify_dir="$GITHUB_WORKSPACE/r2-verify"
          mkdir -p "$verify_dir"
          for target in \
            x86_64-unknown-linux-gnu \
            x86_64-apple-darwin \
            aarch64-apple-darwin \
            x86_64-pc-windows-msvc; do
            archive="opy-provider-${VERSION}-${target}.tar.gz"
            checksum="${archive}.sha256"
            source_dir="dist/opy-provider-${target}"
            key="opy-rs/releases/${VERSION}/${archive}"
            curl --fail --silent --show-error --location \
              --output "$verify_dir/$archive" "$R2_PUBLIC_BASE_URL/$key"
            curl --fail --silent --show-error --location \
              --output "$verify_dir/$checksum" "$R2_PUBLIC_BASE_URL/${key}.sha256"
            cmp --silent "${source_dir}/${archive}" "$verify_dir/$archive"
            cmp --silent "${source_dir}/${checksum}" "$verify_dir/$checksum"
            (cd "$verify_dir" && sha256sum --check "$checksum")
          done
