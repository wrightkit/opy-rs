name: Release-plz

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

jobs:
  release-plz:
    uses: wrightkit/.github/.github/workflows/release-plz-crates.yml@main
    permissions:
      contents: write
      pull-requests: write
    secrets:
      github-token: ${{ secrets.GH_TOKEN }}
      cargo-registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-context:
    name: Resolve opy-rs release
    if: needs.release-plz.outputs.releases_created == 'true'
    needs: release-plz
    runs-on: ubuntu-latest
    outputs:
      opy_release_created: ${{ steps.resolve.outputs.opy_release_created }}
      opy_release_tag: ${{ steps.resolve.outputs.opy_release_tag }}

    steps:
      - name: Select opy-rs release metadata
        id: resolve
        env:
          RELEASES: ${{ needs.release-plz.outputs.releases }}
        run: |
          set -euo pipefail
          opy_release_tag="$(jq -r 'map(select(.package_name == "opy-rs")) | first | .tag // empty' <<<"$RELEASES")"
          if [[ -n "$opy_release_tag" ]]; then
            echo "opy_release_created=true" >> "$GITHUB_OUTPUT"
            echo "opy_release_tag=$opy_release_tag" >> "$GITHUB_OUTPUT"
          else
            echo "opy_release_created=false" >> "$GITHUB_OUTPUT"
            echo "opy_release_tag=" >> "$GITHUB_OUTPUT"
          fi

  provider:
    name: Provider (${{ matrix.target }})
    if: needs.release-context.outputs.opy_release_created == 'true'
    needs: release-context
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-context.outputs.opy_release_tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build provider
        run: cargo build --locked --release --target ${{ matrix.target }} -p opy-provider --bin opy-provider

      - name: Archive provider
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.release-context.outputs.opy_release_tag }}
        run: |
          VERSION="${VERSION#v}"
          mkdir -p dist
          if [[ "$TARGET" == *windows* ]]; then
            BINARY=opy-provider.exe
          else
            BINARY=opy-provider
          fi
          cp "target/$TARGET/release/$BINARY" "dist/$BINARY"
          tar -czf "opy-provider-$VERSION-$TARGET.tar.gz" -C dist "$BINARY"
          ARCHIVE="opy-provider-$VERSION-$TARGET.tar.gz"
          CHECKSUM="${ARCHIVE}.sha256"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "$CHECKSUM"
          else
            shasum -a 256 "$ARCHIVE" > "$CHECKSUM"
          fi

      - name: Stage provider artifact and checksum
        uses: actions/upload-artifact@v7
        with:
          name: opy-provider-${{ matrix.target }}
          path: |
            opy-provider-*.tar.gz
            opy-provider-*.tar.gz.sha256

  publish-provider:
    name: Publish provider release artifacts
    if: needs.release-context.outputs.opy_release_created == 'true'
    needs:
      - release-context
      - provider
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all target artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Prepare provider artifacts and preflight R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          RELEASE_TAG: ${{ needs.release-context.outputs.opy_release_tag }}
          R2_BUCKET: wrightkit-release
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          aws --version
          VERSION="${RELEASE_TAG#v}"
          release_dir="$GITHUB_WORKSPACE/r2-release"
          mkdir -p "$release_dir"

          for target in \
            x86_64-unknown-linux-gnu \
            x86_64-apple-darwin \
            aarch64-apple-darwin \
            x86_64-pc-windows-msvc; do
            archive="opy-provider-${VERSION}-${target}.tar.gz"
            checksum="${archive}.sha256"
            source_dir="dist/opy-provider-${target}"
            test -f "${source_dir}/${archive}"
            test -f "${source_dir}/${checksum}"
            cp "${source_dir}/${archive}" "${release_dir}/${archive}"
            cp "${source_dir}/${checksum}" "${release_dir}/${checksum}"
            expected_hash="$(awk 'NR == 1 { print $1 }' "${release_dir}/${checksum}")"
            actual_hash="$(sha256sum "${release_dir}/${archive}" | awk 'NR == 1 { print $1 }')"
            test "$actual_hash" = "$expected_hash"
          done

          verify_r2_or_absent() {
            local source="$1" key="$2" head_output existing
            if head_output="$(aws s3api head-object \
              --bucket "$R2_BUCKET" \
              --key "$key" \
              --endpoint-url "$R2_ENDPOINT" 2>&1)"; then
              existing="$release_dir/preflight-$(basename "$key")"
              aws s3api get-object \
                --bucket "$R2_BUCKET" \
                --key "$key" \
                --endpoint-url "$R2_ENDPOINT" \
                "$existing" >/dev/null
              cmp --silent "$source" "$existing" || {
                echo "immutable R2 object differs from release artifact: $key" >&2
                exit 1
              }
            elif grep --quiet --extended-regexp '(^|[^0-9])404([^0-9]|$)|NotFound|NoSuchKey' <<<"$head_output"; then
              return
            else
              echo "$head_output" >&2
              exit 1
            fi
          }

          for archive in "$release_dir"/opy-provider-*.tar.gz; do
            checksum="${archive}.sha256"
            name="$(basename "$archive")"
            verify_r2_or_absent "$archive" "$key"
            key="opy-rs/releases/${VERSION}/${name}"
            verify_r2_or_absent "$checksum" "${key}.sha256"
          done

      - name: Upload provider artifacts to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-context.outputs.opy_release_tag }}
        run: |
          set -euo pipefail
          release_dir="$GITHUB_WORKSPACE/r2-release"
          release_json="$release_dir/github-release.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "$release_json"

          github_asset_url() {
            local name="$1"
            jq -r --arg name "$name" \
              '.assets[] | select(.name == $name) | .url // empty' "$release_json"
          }

          uploads=()
          for file in "$release_dir"/opy-provider-*; do
            name="$(basename "$file")"
            asset_url="$(github_asset_url "$name")"
            if [[ -n "$asset_url" ]]; then
              existing="$release_dir/github-$name"
              gh api \
                --header 'Accept: application/octet-stream' \
                "$asset_url" > "$existing"
              cmp --silent "$file" "$existing" || {
                echo "GitHub Release asset differs from rebuilt artifact: $name" >&2
                exit 1
              }
            else
              uploads+=("$file")
            fi
          done

          if ((${#uploads[@]} > 0)); then
            gh release upload "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              "${uploads[@]}"
          fi

      - name: Publish provider artifacts to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          RELEASE_TAG: ${{ needs.release-context.outputs.opy_release_tag }}
          R2_BUCKET: wrightkit-release
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_PUBLIC_BASE_URL: https://releases.wrightkit.dev
        run: |
          set -euo pipefail
          aws --version
          VERSION="${RELEASE_TAG#v}"
          release_dir="$GITHUB_WORKSPACE/r2-release"

          put_immutable() {
            local source="$1" key="$2" cache_control="$3" content_type="$4" head_output existing
            if head_output="$(aws s3api head-object \
              --bucket "$R2_BUCKET" \
              --key "$key" \
              --endpoint-url "$R2_ENDPOINT" 2>&1)"; then
              existing="$release_dir/existing-$(basename "$key")"
              aws s3api get-object \
                --bucket "$R2_BUCKET" \
                --key "$key" \
                --endpoint-url "$R2_ENDPOINT" \
                "$existing" >/dev/null
              cmp --silent "$source" "$existing" || {
                echo "immutable R2 object differs from release artifact: $key" >&2
                exit 1
              }
              return
            elif ! grep --quiet --extended-regexp '(^|[^0-9])404([^0-9]|$)|NotFound|NoSuchKey' <<<"$head_output"; then
              echo "$head_output" >&2
              exit 1
            fi
            aws s3api put-object \
              --bucket "$R2_BUCKET" \
              --key "$key" \
              --body "$source" \
              --if-none-match '*' \
              --cache-control "$cache_control" \
              --content-type "$content_type" \
              --endpoint-url "$R2_ENDPOINT" >/dev/null
          }

          verify_public() {
            local key="$1" source="$2" downloaded
            downloaded="$release_dir/downloaded-$(basename "$key")"
            curl --fail --silent --show-error --location \
              --output "$downloaded" "$R2_PUBLIC_BASE_URL/$key"
            cmp --silent "$source" "$downloaded"
            rm -f "$downloaded"
          }

          for archive in "$release_dir"/opy-provider-*.tar.gz; do
            checksum="${archive}.sha256"
            name="$(basename "$archive")"
            key="opy-rs/releases/${VERSION}/${name}"
            put_immutable "$archive" "$key" 'public, max-age=31536000, immutable' 'application/octet-stream'
            put_immutable "$checksum" "${key}.sha256" 'public, max-age=31536000, immutable' 'text/plain; charset=utf-8'
            verify_public "$key" "$archive"
            verify_public "${key}.sha256" "$checksum"
            downloaded="$release_dir/downloaded-${name}"
            curl --fail --silent --show-error --location \
              --output "$downloaded" "$R2_PUBLIC_BASE_URL/$key"
            expected_hash="$(awk 'NR == 1 { print $1 }' "$checksum")"
            actual_hash="$(sha256sum "$downloaded" | awk 'NR == 1 { print $1 }')"
            test "$actual_hash" = "$expected_hash"
            rm -f "$downloaded"
          done
