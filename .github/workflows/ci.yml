name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  rust-quality:
    name: Rust (${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
          - 1.85.0

    uses: wrightkit/.github/.github/workflows/rust-quality.yml@main
    with:
      toolchain: ${{ matrix.toolchain }}
      cache-shared-key: linux-quality
      all-features: true

  compiler-compatibility:
    name: Compiler compatibility gate
    needs: rust-quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: wrightkit/.github/.github/actions/setup-rust@main
        with:
          toolchain: stable
          cache-shared-key: linux-quality
          cache-targets: false

      - name: Build public compiler CLI
        run: cargo build --locked -p opy-cli --bin opy-cli

      - name: Build internal compatibility evidence target
        run: cargo build --locked --release -p opy-cli --features compatibility --bin opy-compat

      - name: Run OverPy evidence harness tests
        run: python3 -B -m unittest discover -s tools/overpy/tests

      - name: Run native compiler compatibility gate
        run: >-
          python3 -B tools/overpy/run_native.py
          --binary target/debug/opy-cli
          --semantic-binary target/release/opy-compat
          --results target/opy-rs-compiler-results
          --report target/opy-rs-compiler-report.json

      - name: Install pinned OverPy oracle
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - name: Install oracle dependencies
        run: pnpm install --dir tools/overpy/oracle --frozen-lockfile

      - name: Audit manifest parameter names against the oracle
        run: node tools/overpy/audit_param_names.cjs

      - name: Run builtin surface differential probe against the oracle
        run: >-
          python3 -B tools/overpy/probe_builtins.py
          --binary target/release/opy-compat
          --jobs 2
          --report target/opy-rs-builtin-probe-report.json

      - name: Run structural convergence gate for pinned real projects
        run: >-
          python3 -B tools/overpy/structural_gate.py
          --binary target/release/opy-compat
          --report target/opy-rs-structural-gate-report.json

      - name: Upload compiler compatibility report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opy-rs-compiler-compatibility-report
          path: |
            target/opy-rs-builtin-probe-report.json
            target/opy-rs-compiler-report.json
            target/opy-rs-structural-gate-report.json
          if-no-files-found: ignore

  reconstruction-corpus:
    name: Reconstruction corpus gate
    needs: rust-quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: wrightkit/.github/.github/actions/setup-rust@main
        with:
          toolchain: stable
          cache-shared-key: linux-quality
          cache-targets: false

      - name: Run upstream decompiler corpus through reconstruction
        run: cargo test --locked -p opy-rs --test reconstruction_corpus -- --nocapture

  macro-runtime-ports:
    name: JS runtime on ${{ matrix.os }}
    needs: rust-quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: wrightkit/.github/.github/actions/setup-rust@main
        with:
          toolchain: stable
          components: clippy, rustfmt
          cache-shared-key: macro-runtime-${{ runner.os }}
          cache-targets: false
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      - name: Run internal macro runtime tests
        run: cargo test --locked -p opy-rs --lib macro_js::tests

  release-order:
    name: Release promotion order
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Assert the verified-R2-before-promotion release order
        run: python3 tools/verify-release-order.py
