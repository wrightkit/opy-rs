name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  rust-quality:
    name: Rust (${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
          - 1.85.0

    uses: wrightkit/.github/.github/workflows/rust-quality.yml@a83d0f1b4cbcb5b81fb0426e3a5aea1db0899fb5
    with:
      toolchain: ${{ matrix.toolchain }}
      cache-shared-key: linux-quality
      all-features: true

  compiler-compatibility:
    name: Compiler compatibility gate
    needs: rust-quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-quality
          cache-targets: false
          cache-all-crates: false
          cache-workspace-crates: false
          cache-bin: false
          save-if: false
          cache-on-failure: false

      - name: Build public compiler CLI
        run: cargo build --locked -p opy-cli --bin opy-cli

      - name: Build internal compatibility evidence target
        run: cargo build --locked -p opy-cli --features compatibility --bin opy-compat

      - name: Run compatibility harness tests
        run: python3 -B -m unittest discover -s compatibility/tests

      - name: Run native compiler compatibility gate
        run: >-
          python3 -B compatibility/run_native.py
          --binary target/debug/opy-cli
          --semantic-binary target/debug/opy-compat
          --results target/opy-rs-compiler-results
          --report target/opy-rs-compiler-report.json

      - name: Upload compiler compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opy-rs-compiler-compatibility-report
          path: target/opy-rs-compiler-report.json
          if-no-files-found: ignore

  macro-runtime-ports:
    name: JS runtime on ${{ matrix.os }}
    needs: rust-quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macro-runtime-${{ runner.os }}
          cache-targets: false
          cache-all-crates: false
          cache-workspace-crates: false
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false

      - name: Run internal macro runtime tests
        run: cargo test --locked -p opy-rs --lib macro_js::tests
