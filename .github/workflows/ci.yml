name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request supersedes the older run. Pushes to
# main never share a group, so each main commit keeps a complete run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Skipped jobs still report their check names as passing, so a change that
  # touches only documentation does not leave a required check pending.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.code }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Check out repository
        if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
            workflows:
              - '.github/workflows/**'

  workflow-lint:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    uses: wrightkit/.github/.github/workflows/actionlint.yml@main

  rust-quality:
    name: Rust (${{ matrix.toolchain }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
          - 1.88.0

    uses: wrightkit/.github/.github/workflows/rust-quality.yml@main
    with:
      toolchain: ${{ matrix.toolchain }}
      cache-shared-key: linux-quality
      all-features: true
      skip: ${{ needs.changes.outputs.code != 'true' }}

  compiler-compatibility:
    name: Compiler compatibility gate
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: wrightkit/.github/.github/actions/setup-rust@main
        with:
          toolchain: stable
          cache-shared-key: compiler-compatibility
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      - name: Build public compiler CLI
        run: cargo build --locked -p opy-cli --bin opy-cli

      - name: Build internal compatibility evidence target
        run: cargo build --locked --release -p opy-cli --features compatibility --bin opy-compat

      - name: Run OverPy evidence harness tests
        run: python3 -B -m unittest discover -s tools/overpy/tests

      - name: Run native compiler compatibility gate
        run: >-
          python3 -B tools/overpy/run_native.py
          --binary target/debug/opy-cli
          --semantic-binary target/release/opy-compat
          --results target/opy-rs-compiler-results
          --report target/opy-rs-compiler-report.json

      - name: Install pinned OverPy oracle
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.10.0

      - name: Install oracle dependencies
        run: pnpm install --dir tools/overpy/oracle --frozen-lockfile

      - name: Audit manifest parameter names against the oracle
        run: node tools/overpy/audit_param_names.cjs

      - name: Run builtin surface differential probe against the oracle
        run: >-
          python3 -B tools/overpy/probe_builtins.py
          --binary target/release/opy-compat
          --jobs 2
          --report target/opy-rs-builtin-probe-report.json

      - name: Run structural convergence gate for pinned real projects
        run: >-
          python3 -B tools/overpy/structural_gate.py
          --binary target/release/opy-compat
          --report target/opy-rs-structural-gate-report.json

      - name: Upload compiler compatibility report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opy-rs-compiler-compatibility-report
          path: |
            target/opy-rs-builtin-probe-report.json
            target/opy-rs-compiler-report.json
            target/opy-rs-structural-gate-report.json
          if-no-files-found: ignore

  # Deliberate re-execution: rust-quality runs the corpus test binary under
  # --all-features, but this job exercises the default feature set — the
  # feature identity consumers actually build against — so a feature-gated
  # reconstruction path cannot hide behind optional features (#646).
  reconstruction-corpus:
    name: Reconstruction corpus gate
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: wrightkit/.github/.github/actions/setup-rust@main
        with:
          toolchain: stable
          cache-shared-key: linux-quality
          cache-targets: false

      - name: Run upstream decompiler corpus through reconstruction
        run: cargo test --locked -p opy-rs --test reconstruction_corpus -- --nocapture

  macro-runtime-ports:
    name: JS runtime on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: wrightkit/.github/.github/actions/setup-rust@main
        with:
          toolchain: stable
          cache-shared-key: macro-runtime-${{ runner.os }}
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      - name: Run internal macro runtime tests
        run: cargo test --locked -p opy-rs --lib macro_js::tests

  release-order:
    name: Release promotion order
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert the verified-R2-before-promotion release order
        run: python3 tools/verify-release-order.py
