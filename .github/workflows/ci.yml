name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-quality:
    name: Rust quality (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
          - 1.85.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect workspace crates
        id: crates
        run: |
          if [ -d crates ] && ls crates/*/Cargo.toml >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        if: steps.crates.outputs.exists == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
          rustflags: ""

      - name: Check formatting
        if: steps.crates.outputs.exists == 'true'
        run: cargo fmt --all -- --check

      - name: Run Clippy
        if: steps.crates.outputs.exists == 'true'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        if: steps.crates.outputs.exists == 'true'
        run: cargo test --workspace --all-targets --all-features

      - name: Note docs-only branch
        if: steps.crates.outputs.exists == 'false'
        run: echo "No workspace crates on this branch; Rust quality gates skipped."

  macro-runtime-ports:
    name: JS runtime on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt
          rustflags: ""

      - name: Run opy-macro-js tests
        run: cargo test -p opy-macro-js --all-targets
