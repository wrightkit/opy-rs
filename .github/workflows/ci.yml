name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  rust-quality:
    name: Rust quality (${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
          - 1.85.0

    uses: wrightkit/.github/.github/workflows/rust-quality.yml@9a91b5e32cc6d90b79b2b9b47a62b835ab94ec86
    with:
      toolchain: ${{ matrix.toolchain }}
      cache-shared-key: linux-quality
      all-features: true

  macro-runtime-ports:
    name: JS runtime on ${{ matrix.os }}
    needs: rust-quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macro-runtime-${{ runner.os }}
          cache-targets: false
          cache-all-crates: false
          cache-workspace-crates: false
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false

      - name: Run opy-macro-js tests
        run: cargo test --locked -p opy-macro-js --all-targets
