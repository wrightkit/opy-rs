name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  rust-quality:
    name: Rust quality (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
          - 1.85.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect workspace crates
        id: crates
        run: |
          if [ -d crates ] && ls crates/*/Cargo.toml >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        if: steps.crates.outputs.exists == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - name: Restore Rust cache
        if: steps.crates.outputs.exists == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-quality
          cache-targets: true
          cache-all-crates: false
          cache-workspace-crates: false
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false

      - name: Check formatting
        if: steps.crates.outputs.exists == 'true'
        run: cargo fmt --all -- --check

      - name: Run Clippy
        if: steps.crates.outputs.exists == 'true'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        if: steps.crates.outputs.exists == 'true'
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Note docs-only branch
        if: steps.crates.outputs.exists == 'false'
        run: echo "No workspace crates on this branch; Rust quality gates skipped."

  macro-runtime-ports:
    name: JS runtime on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macro-runtime-${{ runner.os }}
          cache-targets: false
          cache-all-crates: false
          cache-workspace-crates: false
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false

      - name: Run opy-macro-js tests
        run: cargo test --locked -p opy-macro-js --all-targets
