[package]
name = "opy-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Standalone OverPy-compatible .opy implementation with parsing, tooling, and bounded Workshop compilation."

[lints]
workspace = true

[dependencies]
libm.workspace = true
libquickjs-ng-sys.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
workshop-rs.workspace = true

[dev-dependencies]
sha2.workspace = true

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31", default-features = false, features = ["resource", "user"] }
