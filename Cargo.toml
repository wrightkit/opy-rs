[workspace]
members = ["crates/opy-rs", "crates/opy-cli", "crates/opy-provider"]
resolver = "3"

[workspace.package]
version = "0.1.33"
edition = "2024"
rust-version = "1.85.0"
license = "AGPL-3.0-or-later"
repository = "https://github.com/wrightkit/opy-rs"

[workspace.dependencies]
opy-rs = { path = "crates/opy-rs", version = "0.1.33" }
libquickjs-ng-sys = "0.13.0"
serde = "1"
serde_json = "1"
sha2 = "0.10"
workshop-rs = "0.3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Reduce dependency artifact volume while retaining line-table diagnostics for
# WrightKit code. See wrightkit/.github docs/rust-build-artifacts.md.
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false

[profile.test]
debug = 1

[profile.test.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = "debuginfo"
